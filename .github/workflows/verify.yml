name: Verify Runewarden HUD
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local verification tools
        run: |
          chmod +x gradlew
          python -m pip install -r tools/requirements.txt
      - name: Validate bundled data and production API surface
        run: |
          python tools/validate_bundle.py
          python tools/validate_hub_release.py
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/measure_code_tokens.py --output build/reports/code-budget.json
      - name: Build and test the plugin
        run: ./gradlew --no-daemon --no-parallel check jar --console=plain
      - name: Verify production JAR
        run: python tools/check_hub_jar.py
      - name: Verify development launcher package
        run: ./gradlew --no-daemon --no-parallel devTestZip --console=plain
      - name: Preserve tests, code budget and UI fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-verification-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
            build/previews/
          retention-days: 14
      - name: Preserve the plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: runewarden-plugin-${{ matrix.os }}
          path: build/libs/runewarden-0.10.2.jar
          retention-days: 14
