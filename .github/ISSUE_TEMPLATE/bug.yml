name: Bug report
description: Report a reproducible Runewarden problem
body:
  - type: input
    id: version
    attributes:
      label: Runewarden and RuneLite versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, module and expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and relevant diagnostics
      description: Remove account names, chat, tokens and other private data before attaching logs or images.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, interface scaling and enabled related plugins
